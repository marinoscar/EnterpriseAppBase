name: One-off npm publish
on:
  workflow_dispatch:
  push:
    branches: [claude/sweet-dijkstra-x0bf2o]
    paths: ['.github/workflows/oneoff-npm-publish.yml']
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build:packages
      - name: Refuse to publish while changesets are pending
        run: |
          pending=$(node -e "const fs=require('fs');const done=new Set(require('./.changeset/pre.json').changesets);console.log(fs.readdirSync('.changeset').filter(f=>f.endsWith('.md')&&f!=='README.md'&&!done.has(f.slice(0,-3))).length)")
          test "$pending" = "0" || { echo "::error::version PR not merged yet"; exit 1; }
      - name: Publish with provenance
        run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Tag the platform version
        run: |
          v=$(node -p "require('./packages/platform-api/package.json').version")
          git ls-remote --exit-code --tags origin "refs/tags/platform-v$v" >/dev/null || { git tag "platform-v$v" && git push origin "platform-v$v"; }
      - name: Show dist-tags
        run: for p in contract api web db cli infra; do npm dist-tag ls "@marinoscar/platform-$p"; done
