name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Deliberately ONE job for build/test, not several concurrent ones.
#
# Splitting the web suite into its own job was tried and measured, and it is
# slower. Across measured runs the suite takes 71-95s inside this job but
# 118-131s in a fresh one — the ranges do not overlap, though runner variance
# is real and the point estimates should not be trusted too precisely. The
# likely cause is that here it inherits a filesystem page cache already warmed
# by npm ci, the typechecks and the API tests; `import` is the metric that
# inflates most (54s -> 100s). Overall wall clock went 144s -> 152-159s.
#
# Ruled out along the way: the scoped install is not the cause (a full install
# in a separate job is still 118s), and it is not job contention (three jobs
# behaved the same as four).
# =============================================================================

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npx prisma generate
        working-directory: apps/api

      - run: npm run typecheck --workspace=api
      - run: npm run typecheck --workspace=web

      - run: npm test --workspace=api
      - run: npm run test:run --workspace=web

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    # No `needs:` — this reads decorator metadata only and shares nothing with
    # the build job, so it runs concurrently rather than queueing behind it.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # The dump imports AppModule, which imports @prisma/client. Preview mode
      # never instantiates PrismaService, but the generated client still has to
      # exist for the import to resolve.
      - run: npx prisma generate
        working-directory: apps/api

      - run: npm run openapi:typecheck --workspace=api

      # Boots the app in Nest preview mode: every module loaded and every
      # controller's metadata read, no provider instantiated — so no database,
      # no object storage and no credentials are needed here.
      - run: npm run openapi:dump

      - run: npm run openapi:lint

  smoke:
    name: Smoke (boot compiled API)
    runs-on: ubuntu-latest
    # No `needs:` — runs concurrently with `build`, like `openapi` does.
    #
    # WHY THIS IS A SEPARATE JOB, given the note at the top of this file
    # -------------------------------------------------------------------------
    # That note records a measured result: moving the *web test suite* into its
    # own job made it slower (71-95s -> 118-131s), plausibly from losing a page
    # cache the earlier steps had warmed. It is a real finding, and the default
    # here should be one job. This job is the deliberate exception, because the
    # measurement does not transfer:
    #
    #   - That split duplicated `npm ci` to run *the same* work somewhere else,
    #     so its cost was pure overhead. This job runs work that exists nowhere
    #     in CI today — `nest build`, `migrate deploy`, `db seed`, and booting
    #     the artifact — so the comparison is not "same work, colder cache".
    #   - Running concurrently, its cost to total wall clock is
    #     max(build, smoke), not build + smoke. Appending these steps to
    #     `Build & Test` would instead extend the longest job on the critical
    #     path by the full build-plus-boot time.
    #   - The dominant costs here are compilation and waiting on Postgres and
    #     on bootstrap. Only the first is filesystem-bound, so the specific
    #     effect the note measured has much less to bite on.
    #
    # There is also a correctness reason not to fold this into `Build & Test`:
    # that job sets `NODE_ENV: test` for the whole job, while this one must run
    # the artifact with `NODE_ENV=production` — the mode that actually deploys,
    # and the only one in which `app.module.ts` leaves `TestAuthModule` out.
    # A service container is job-scoped too, so folding it in would start
    # Postgres for every unit-test run that has no use for it.
    #
    # If the assumption above turns out to be wrong, the thing to measure is
    # total workflow wall clock, not this job's own duration.
    services:
      postgres:
        # Matches infra/compose/test.compose.yml, which is the only Postgres
        # version this repo pins (base.compose.yml expects an external database
        # and declares no `db` service).
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The API never reads DATABASE_URL from the environment — it builds the
      # connection string from these at runtime (src/config/configuration.ts,
      # src/prisma/prisma.service.ts) and the Prisma CLI does the same via
      # scripts/prisma-env.js. Setting the POSTGRES_* variables is therefore
      # what exercises the contract the application actually has.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
      POSTGRES_SSL: 'false'
      # Obviously-fake values. GOOGLE_CLIENT_ID is the one that is genuinely
      # mandatory: GoogleStrategy passes it straight to passport-google-oauth20,
      # which throws `OAuth2Strategy requires a clientID option` on an empty
      # string and takes bootstrap down with it. The rest are supplied because a
      # real deployment has them, not because bootstrap fails without them.
      JWT_SECRET: smoke-test-jwt-secret-not-a-real-secret-0000
      COOKIE_SECRET: smoke-test-cookie-secret-not-a-real-secret
      GOOGLE_CLIENT_ID: smoke-test-google-client-id
      GOOGLE_CLIENT_SECRET: smoke-test-google-client-secret
      GOOGLE_CALLBACK_URL: http://127.0.0.1:3001/api/auth/google/callback
      INITIAL_ADMIN_EMAIL: smoke-admin@example.test
      OTEL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # NODE_ENV is deliberately left unset for the install and build steps:
      # `npm ci` skips devDependencies under NODE_ENV=production, which would
      # remove @nestjs/cli (the build), the Prisma CLI (migrations) and ts-node
      # (the seed). Only the final step runs as production.
      - run: npm ci

      - run: npx prisma generate
        working-directory: apps/api

      # The point of this job: the smoke test runs `dist/main.js`, the same
      # artifact the Dockerfile runs, rather than a Test.createTestingModule
      # stand-in that never executes main.ts.
      - run: npm run build --workspace=api

      # First time migrations and seeding run against a real database in CI.
      # Both were previously exercised only by hand, which is how #56 (broken
      # seeding) stayed hidden. These two steps — not the smoke test's readiness
      # check — are what actually verify the schema: the readiness indicator
      # issues a `SELECT 1`, which passes against an empty database, whereas the
      # seed writes real rows and fails on a schema that does not match.
      - run: npm run prisma:migrate --workspace=api
      - run: npm run prisma:seed --workspace=api

      # Boots the compiled app and asserts it serves /api/health/live,
      # /api/health/ready and a valid /api/openapi.json. See the header of
      # apps/api/scripts/smoke-test.mjs for what each assertion is protecting —
      # in particular why a 200 on the OpenAPI document, and not merely a
      # successful boot, is the assertion that matters.
      - run: npm run smoke --workspace=api
        env:
          NODE_ENV: production
          SMOKE_PORT: '3001'

  visual:
    name: Visual regression (issue #107)
    runs-on: ubuntu-latest
    # No `needs:` — runs concurrently with `build`, like `openapi` and `smoke`
    # do, for the same reason: it shares no state with them (no database, no
    # compiled API artifact) and gains nothing by queueing behind either.
    #
    # WHY A DEDICATED CONTAINER, PINNED TO AN EXACT PLAYWRIGHT BUILD
    # -------------------------------------------------------------------------
    # This job asserts PIXELS, not DOM state — the one kind of assertion
    # nothing else in this workflow makes. `Build & Test` runs the Vitest+RTL
    # suite against jsdom, which has no layout engine at all (no
    # `offsetWidth`, no wrapping, no font metrics), so it structurally cannot
    # catch a layout regression like #105 (a destination rendered in the wrong
    # position; a caption clipped by 2px of padding) — see
    # `apps/web/visual/main.tsx` for the full account of why this suite exists.
    # A pixel baseline is sensitive to the exact browser BUILD, not just the
    # Playwright *API* version, so this job runs inside the same
    # `mcr.microsoft.com/playwright:v1.62.1-noble` image the baselines under
    # `tests/visual/specs/**/*-snapshots/` were generated in, and
    # `tests/visual/package.json` pins `@playwright/test` to that exact
    # version with no caret — unlike `tests/e2e`'s `^1.40.0`, which only ever
    # asserts DOM state and so is safe to float.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # The root install (workspaces: apps/*) gets `apps/web` and its Vite dev
      # server — what the harness in `apps/web/visual` runs on. `tests/visual`
      # is NOT an npm workspace (same reason `tests/e2e` isn't: these are
      # test-runner packages, not application code), so its own
      # `@playwright/test` install is separate.
      - run: npm ci
      - run: npm ci
        working-directory: tests/visual

      # Fails the job on ANY pixel diff (default `expect(page).toHaveScreenshot()`
      # behavior) or on a missing baseline. `playwright.config.ts` boots
      # `apps/web/visual`'s own Vite dev server itself (`webServer`) — no
      # compose stack, no database, no API — so there is nothing else to start
      # here.
      #
      # `tests/visual/node_modules/.bin/playwright` directly, NOT `npx
      # playwright`: `npx` resolves the binary by walking up from the repo
      # root, which has no local `playwright` install of its own (only
      # `apps/web`'s dependencies are hoisted there), so it falls back to an
      # ad-hoc download of whatever the latest published version is — a
      # DIFFERENT `@playwright/test` module instance than the pinned one
      # `tests/visual/specs/*.spec.ts` import, which throws "Playwright Test
      # did not expect test() to be called here" (two copies of the module,
      # two singletons). Verified by hitting exactly this failure while
      # building the suite; the direct binary path is the fix, not a
      # style preference.
      - run: tests/visual/node_modules/.bin/playwright test --config=tests/visual/playwright.config.ts

      # Uploaded unconditionally (`if: always()`) so a failing run is
      # diagnosable from the Actions UI: the HTML report embeds the
      # expected/actual/diff PNG for every failed assertion, which is far
      # faster to read than reproducing the failure locally from scratch.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-playwright-report
          path: tests/visual/playwright-report/
          retention-days: 14
