name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  # Builds, pushes, attests (SBOM, provenance) and signs the api, web, worker
  # and stack-agent images through the reusable images.yml. `app-release`
  # keeps this flow's tag set: semver, major.minor, the bare sha, and latest
  # on main. Its outputs keep the names this job always had.
  #
  # The worker node image (issue #278, epic #254) is the third target, built
  # from apps/cli/Dockerfile (target production). Every image name follows a
  # fork's own repository automatically: images.yml derives it, lower-cased,
  # from the repository owner and name.
  build-and-push:
    name: Build and Push Images
    permissions:
      contents: read
      packages: write
      id-token: write # keyless image signatures
      security-events: write # vulnerability scan to code scanning
    uses: ./.github/workflows/images.yml
    with:
      app-release: true

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.example.com

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying version ${{ needs.build-and-push.outputs.version }} to staging"
          echo "API Image: ${{ needs.build-and-push.outputs.api-image }}"
          echo "Web Image: ${{ needs.build-and-push.outputs.web-image }}"
          # Add your deployment commands here (kubectl, docker-compose, etc.)

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://example.com

    steps:
      - name: Deploy to production
        run: |
          echo "Deploying version ${{ needs.build-and-push.outputs.version }} to production"
          echo "API Image: ${{ needs.build-and-push.outputs.api-image }}"
          echo "Web Image: ${{ needs.build-and-push.outputs.web-image }}"
          # Add your deployment commands here (kubectl, docker-compose, etc.)
