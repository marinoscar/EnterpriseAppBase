# EvoPath's two SSE routes (#714), as app locations instead of edits of
# nginx.conf. Each is the platform snippet, which also repeats the security
# headers, so a later add_header in either block cannot silently drop them.
location /api/coach/chat/stream {
    include /etc/nginx/platform/sse-proxy.conf;
}

location /api/ai/training/stream {
    include /etc/nginx/platform/sse-proxy.conf;
    # An extra header of the app's own: allowed, because the snippet already
    # restated the security headers in this location.
    add_header Cache-Control "no-store" always;
}
