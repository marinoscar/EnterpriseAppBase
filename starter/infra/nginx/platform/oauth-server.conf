# Source of truth: @marinoscar/platform-infra/nginx/platform/oauth-server.conf; re-materialise with `npx platform-infra sync`
# =============================================================================
# The OAuth server's well-known documents at the site root (PP-15.6)
# =============================================================================
# Include it from an app location file, app.d/locations/oauth-server.conf:
#
#   include /etc/nginx/platform/oauth-server.conf;
#
# A hosted AI client (Claude, ChatGPT, an MCP inspector) discovers how to sign in
# from `/.well-known/...` at the ROOT of the host (RFC 8414, RFC 9728). The API owns
# the `/api` prefix and the documents depend on runtime settings and registered
# resources, so it serves them at /api/oauth/.well-known/... and this file
# publishes them at the root:
#
#   = /.well-known/oauth-authorization-server
#   ^~ /.well-known/oauth-authorization-server/   (path-suffixed lookups by some clients)
#       -> /api/oauth/.well-known/authorization-server   (the same document)
#   = /.well-known/oauth-protected-resource
#       -> /api/oauth/.well-known/protected-resource     (the only resource; 404 otherwise)
#   ^~ /.well-known/oauth-protected-resource/<path>
#       -> /api/oauth/.well-known/protected-resource/<path>
#   = /.well-known/openid-configuration  (and the path-suffixed form)
#       -> a JSON 404: this server is not an OpenID provider. Answered here, fast.
#   ^~ /.well-known/oauth-   (anything else of that family)
#       -> a JSON 404
#
# JSON, NEVER THE SPA. Without these blocks every unknown /.well-known/* path
# falls through to `location /` and the web app answers it with index.html and a
# 200, which a client fails on in confusing ways. The proxied locations pass the
# API's own answer through, its JSON 404s included (`proxy_intercept_errors` is
# off), so a disabled server or an unknown resource is a JSON 404 too.
#
# Headers. The proxied locations declare no add_header, so the server-level
# security set (X-Content-Type-Options: nosniff and the rest) applies, and the
# API sets Content-Type: application/json, Cache-Control and
# Access-Control-Allow-Origin itself. The JSON 404 locations include
# platform/security-headers.conf (nginx replaces add_header, never merges) and add
# the wildcard CORS header, because a browser-based client reads them too.
# =============================================================================

location = /.well-known/oauth-authorization-server {
    proxy_pass http://api_upstream/api/oauth/.well-known/authorization-server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection '';

    proxy_connect_timeout 10s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}

location ^~ /.well-known/oauth-authorization-server/ {
    rewrite ^ /api/oauth/.well-known/authorization-server break;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection '';

    proxy_connect_timeout 10s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}

location = /.well-known/oauth-protected-resource {
    proxy_pass http://api_upstream/api/oauth/.well-known/protected-resource;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection '';

    proxy_connect_timeout 10s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}

# With a URI on proxy_pass, the matched prefix (`/.well-known/oauth-protected-resource/`)
# is replaced by it, so `/.well-known/oauth-protected-resource/api/mcp` reaches
# `/api/oauth/.well-known/protected-resource/api/mcp`.
location ^~ /.well-known/oauth-protected-resource/ {
    proxy_pass http://api_upstream/api/oauth/.well-known/protected-resource/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection '';

    proxy_connect_timeout 10s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}

location = /.well-known/openid-configuration {
    include /etc/nginx/platform/security-headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
    default_type application/json;
    return 404 '{"error":"not_found","error_description":"This server is not an OpenID provider; use /.well-known/oauth-authorization-server."}';
}

location ^~ /.well-known/openid-configuration/ {
    include /etc/nginx/platform/security-headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
    default_type application/json;
    return 404 '{"error":"not_found","error_description":"This server is not an OpenID provider; use /.well-known/oauth-authorization-server."}';
}

# The rest of the family (a typo, a document this server does not publish): JSON, not the SPA.
# Longer prefixes and the exact matches above win over this one.
location ^~ /.well-known/oauth- {
    include /etc/nginx/platform/security-headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
    default_type application/json;
    return 404 '{"error":"not_found"}';
}
