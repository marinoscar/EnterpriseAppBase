# =============================================================================
# App compose overlay: one state volume per worker replica (APP-OWNED)
# =============================================================================
# Needed for `docker compose -f worker.compose.yml up --scale worker=N` with
# N > 1.
#
# worker.compose.yml (GENERATED) mounts ONE named volume, `worker-state`, at the
# state directory, and Compose gives every replica of a service the SAME named
# volume. All N replicas then share one `node.pid` and one `node.sock`. Each
# container has its own PID namespace, so the pid in the pidfile (PID 1, the
# exec-form entrypoint) looks alive to every other replica, and the live socket
# confirms it: replicas 2..N refuse to start ("A worker is already running
# here ... use a different state directory") and, under
# `restart: unless-stopped`, crash-loop. Each refused replica has already
# registered a node row, so the fleet also fills with offline nodes.
#
# An anonymous volume belongs to ONE container, so each replica gets its own
# state directory (pidfile, socket, logs, heap snapshots, scratch). It starts
# from the image's `/var/lib/worker` (owned by `node`) and survives a container
# restart, so the snapshot the memory watchdog writes before its deliberate
# exit is still there afterwards. `docker compose down` keeps the volumes;
# `down -v` removes them.
#
# `!override` drops the base file's `worker-state:/var/lib/worker` mount, which
# would otherwise be merged in alongside this one; the `worker-state` volume
# stays declared there and goes unused.
#
# KNOWN LIMIT, not fixed here: after SIGKILL or a kernel OOM kill the pidfile
# survives on the volume and names PID 1, which is the restarted container's own
# process, so the worker refuses to start. Remove that one container together
# with its volume and let Compose recreate it:
#   docker rm -f -v <container> && docker compose up -d --scale worker=N
#
# Applies only to worker modes: the `worker` scope in the file name keeps it out
# of base, dev and prod.
# =============================================================================

services:
  worker:
    volumes: !override
      - /var/lib/worker
