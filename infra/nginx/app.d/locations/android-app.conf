# The Android companion's edge locations (#746): /.well-known/assetlinks.json
# to the API, the 150 MiB APK upload and the unbuffered signed download. The
# locations live in the platform snippet (generated by `platform-infra sync`);
# this app-owned file opts the reference app in. An app without an Android
# companion deletes this file.
include /etc/nginx/platform/android-app.conf;
