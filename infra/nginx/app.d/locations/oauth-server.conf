# The OAuth server's well-known documents (PP-15.6): /.well-known/oauth-authorization-server,
# /.well-known/oauth-protected-resource[/<path>] to the API, and a JSON 404 for
# /.well-known/openid-configuration. The locations live in the platform snippet
# (generated by `platform-infra sync`); this app-owned file opts the reference app in.
# An app without the OAuth server deletes this file.
include /etc/nginx/platform/oauth-server.conf;
