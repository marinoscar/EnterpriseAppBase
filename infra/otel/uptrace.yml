##
## Uptrace 1.7.x configuration
##

# ClickHouse for traces and metrics storage
ch:
  addr: clickhouse:9000
  user: default
  database: uptrace

# PostgreSQL for metadata (uses UPTRACE_PG* environment variables)
pg:
  addr: uptrace-pg:5432
  user: uptrace
  password: "${UPTRACE_PGPASSWORD}"
  database: uptrace

projects:
  - id: 1
    name: Enterprise App
    token: "${UPTRACE_PROJECT1_TOKEN}"
    pinned_attrs:
      - service.name
      - host.name

listen:
  grpc:
    addr: ":14317"
  http:
    addr: ":14318"

# Local-development credentials come from infra/compose/.env, which is
# git-ignored. See .env.example for the defaults.
auth:
  users:
    - email: admin@localhost
      password: "${UPTRACE_ADMIN_PASSWORD}"
      notify_by_email: false

secret_key: "${UPTRACE_SECRET_KEY}"
